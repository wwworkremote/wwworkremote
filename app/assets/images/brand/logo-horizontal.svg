<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200" width="100%" height="100%">
  <defs>
    <linearGradient id="hBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a1c1f"/>
      <stop offset="100%" stop-color="#111215"/>
    </linearGradient>
    <linearGradient id="hWaveGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6fa8f0"/>
      <stop offset="100%" stop-color="#4077e6"/>
    </linearGradient>
    <linearGradient id="hWaveGrad2" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6292f0"/>
      <stop offset="100%" stop-color="#82b1ff"/>
    </linearGradient>
    <filter id="hGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Left Mark (scaled) -->
  <g transform="translate(20, 20) scale(0.3125)">
    <rect x="16" y="16" width="480" height="480" rx="108" fill="url(#hBgGrad)" stroke="#2a2d31" stroke-width="6"/>
    <circle cx="256" cy="270" r="160" fill="none" stroke="#6292f0" stroke-width="2" stroke-dasharray="6 8" opacity="0.15"/>
    <path d="M 120 330 L 180 180 L 256 300 L 332 180 L 392 330" fill="none" stroke="url(#hWaveGrad1)" stroke-width="28" stroke-linecap="round" stroke-linejoin="round" filter="url(#hGlow)"/>
    <path d="M 180 180 L 256 300 L 332 180" fill="none" stroke="url(#hWaveGrad2)" stroke-width="22" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="120" cy="330" r="14" fill="#6fa8f0" stroke="#131416" stroke-width="4"/>
    <circle cx="180" cy="180" r="14" fill="#82b1ff" stroke="#131416" stroke-width="4"/>
    <circle cx="256" cy="300" r="16" fill="#6292f0" stroke="#131416" stroke-width="4"/>
    <circle cx="332" cy="180" r="14" fill="#82b1ff" stroke="#131416" stroke-width="4"/>
    <circle cx="392" cy="330" r="14" fill="#6fa8f0" stroke="#131416" stroke-width="4"/>
    <circle cx="256" cy="140" r="10" fill="#4caf6e" filter="url(#hGlow)"/>
    <circle cx="256" cy="140" r="5" fill="#ffffff"/>
  </g>

  <!-- Brand Typography -->
  <text x="210" y="112" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="54" font-weight="800" letter-spacing="-0.03em" fill="#e8e9ea">
    WWWork<tspan fill="#6292f0">Remote</tspan>
  </text>
  <text x="212" y="148" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="500" letter-spacing="0.18em" fill="#8a94a5">
    MARKET INTELLIGENCE ENGINE
  </text>
</svg>
