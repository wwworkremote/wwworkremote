<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a1c1f"/>
      <stop offset="100%" stop-color="#111215"/>
    </linearGradient>
    <linearGradient id="waveGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6fa8f0"/>
      <stop offset="100%" stop-color="#4077e6"/>
    </linearGradient>
    <linearGradient id="waveGrad2" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6292f0"/>
      <stop offset="100%" stop-color="#82b1ff"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Base container rounded squircle -->
  <rect x="16" y="16" width="480" height="480" rx="108" fill="url(#bgGrad)" stroke="#2a2d31" stroke-width="6"/>

  <!-- Subtle inner radar arc grid -->
  <circle cx="256" cy="270" r="160" fill="none" stroke="#6292f0" stroke-width="1.5" stroke-dasharray="6 8" opacity="0.15"/>
  <circle cx="256" cy="270" r="110" fill="none" stroke="#6292f0" stroke-width="1.5" stroke-dasharray="4 6" opacity="0.2"/>

  <!-- Interconnected telemetry paths -->
  <path d="M 120 330 L 180 180 L 256 300 L 332 180 L 392 330" fill="none" stroke="#6292f0" stroke-width="32" stroke-linecap="round" stroke-linejoin="round" opacity="0.3"/>

  <!-- High-contrast primary faceted "W" signal -->
  <path d="M 120 330 L 180 180 L 256 300 L 332 180 L 392 330" fill="none" stroke="url(#waveGrad1)" stroke-width="26" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>

  <!-- Inner central beam accent -->
  <path d="M 180 180 L 256 300 L 332 180" fill="none" stroke="url(#waveGrad2)" stroke-width="22" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Signal radar nodes -->
  <circle cx="120" cy="330" r="14" fill="#6fa8f0" stroke="#131416" stroke-width="4"/>
  <circle cx="180" cy="180" r="14" fill="#82b1ff" stroke="#131416" stroke-width="4"/>
  <circle cx="256" cy="300" r="16" fill="#6292f0" stroke="#131416" stroke-width="4"/>
  <circle cx="332" cy="180" r="14" fill="#82b1ff" stroke="#131416" stroke-width="4"/>
  <circle cx="392" cy="330" r="14" fill="#6fa8f0" stroke="#131416" stroke-width="4"/>

  <!-- Live synthesis focal point (green indicator) -->
  <circle cx="256" cy="140" r="10" fill="#4caf6e" filter="url(#glow)"/>
  <circle cx="256" cy="140" r="5" fill="#ffffff"/>
</svg>
